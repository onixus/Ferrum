apiVersion: ferrum.io/v1
kind: PolicyException
metadata:
  name: debug-sidecar
  namespace: payments
spec:
  ticket: JIRA-18421
  requestedBy: platform-sre
  approvedBy: ib-architect
  reason: temporary debug sidecar after incident
  # Эту дату придётся обновлять, и это свойство примера, а не оплошность.
  # Файл валидируют как пример четыре набора тестов (ferrum-cli, ferrum-api,
  # ferrum-policy, roundtrip), а два правила зажимают дату с обеих сторон:
  # прошлое запрещено ("исключение родилось мёртвым"), и больше 90 дней
  # вперёд тоже ("уже не исключение, а новая политика без комитета"). Любая
  # записанная сюда дата протухает не позже чем через 90 дней. Предыдущая
  # уронила сборку в 18:35 UTC 2026-09-09, истекши в 18:00 того же дня.
  expiresAt: "2026-11-01T00:00:00Z"
  fourEyes: true
  target:
    namespace: payments
    policies: [prod-restricted]
    rules: [no-shell]
