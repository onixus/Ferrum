apiVersion: ferrum.io/v1
kind: PolicyException
metadata:
  name: debug-sidecar
  namespace: payments
spec:
  ticket: JIRA-18421
  requestedBy: platform-sre
  approvedBy: ib-architect
  reason: temporary debug sidecar after incident
  # Дата здесь — иллюстрация, и она однажды истечёт: валидатор зажимает её
  # с обеих сторон (прошлое запрещено, дальше 90 дней тоже), так что вечной
  # даты для этого поля не существует в принципе. Тесты на это больше не
  # опираются — они подставляют свежую дату и проверяют правила, а не
  # календарь; см. ferrum_testkit::exception_ok_yaml_valid_now. Раньше
  # опирались, и 2026-09-09 пример истёк в 18:00, уронив сборку в 18:35.
  #
  # Что всё ещё сломается после этой даты: `ferrumctl validate` на этом файле
  # у живого человека. Это верное поведение — просроченное исключение и
  # должно отвергаться, — но если файл станет примером «как надо» в
  # документации, дату придётся подвинуть.
  expiresAt: "2026-11-01T00:00:00Z"
  fourEyes: true
  target:
    namespace: payments
    policies: [prod-restricted]
    rules: [no-shell]
