apiVersion: ferrum.io/v1
kind: ClusterSecurityPolicy
metadata:
  name: prod-restricted
spec:
  mode: audit
  priority: 100
  selector:
    namespaceSelector:
      matchExpressions:
        - key: ferrum.io/zone
          operator: In
          values: [pci, secrets]
    image:
      registriesAllow:
        - registry.internal.example
      requireDigest: true
  supply:
    requireSigned: true
    denyUnsigned: true
    denyLatestTag: true
    trustRoots:
      - name: org-cosign
        keylessIssuerAllow:
          - https://token.actions.githubusercontent.com
        # fixture only, not a prod key
        publicKeys:
          - "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  admit:
    failurePolicy: Fail
    pss: restricted
    deny:
      privileged: true
      hostPID: true
      hostIPC: true
      hostNetwork: true
      hostPath: true
      allowPrivilegeEscalation: true
      runAsRoot: true
      wildcardsRbac: true
      clusterAdminBind: true
      addedCapabilities:
        - SYS_ADMIN
        - NET_ADMIN
        - SYS_PTRACE
        - SYS_MODULE
    mutate:
      injectSeccompRuntimeDefault: true
      dropAllCapabilities: true
      readOnlyRootFilesystem: true
  runtime:
    defaultAction: audit
    rules:
      - id: no-shell
        syscalls: [execve, execveat]
        match:
          commIn: [sh, bash, ash, dash, zsh]
          containerOnly: true
        action: kill
      # containerOnly: the node's own containerd/kubelet opens these sockets
      # constantly. Without it every one of those opens decides kill, gets
      # refused because the caller is not in a container, and is exported as a
      # kill that never happened — a permanent false stream on a healthy node.
      - id: no-runtime-sock
        match:
          pathSuffix: [docker.sock, containerd.sock, crio.sock]
          containerOnly: true
        action: kill
      # audit, not deny: a tracepoint fires after the syscall has already run,
      # so the runtime plane cannot un-run bpf()/init_module(). Blocking those
      # is admission's job (admit.deny SYS_MODULE, privileged); what this plane
      # can honestly do is name the caller in the audit trail.
      - id: no-module
        syscalls: [init_module, finit_module, bpf]
        match:
          notAgentSelf: true
        action: audit
