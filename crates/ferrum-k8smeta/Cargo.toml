[package]
name = "ferrum-k8smeta"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "cgroup inode -> pod identity. Forbidden: kube client, tokio, aya."

[dependencies]
ferrum-common.workspace = true
serde_json.workspace = true
# Network watch only: the default build of a crate on the decision path links no TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[features]
default = []
apiserver = ["dep:rustls"]
