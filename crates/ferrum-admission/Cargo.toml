[package]
name = "ferrum-admission"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Webhook. Forbidden: ferrum-compiler, aya, outbound net on hot path."

[dependencies]
chrono.workspace = true
ferrum-api.workspace = true
# Break-glass grants and their journal. Graph is chrono, ferrum-common,
# ferrum-crypto, serde and sha2 — all of which this crate already carries; the
# suspension mechanism adds no network, no client and no runtime to the
# decision path.
ferrum-breakglass.workspace = true
ferrum-common.workspace = true
ferrum-crypto.workspace = true
ferrum-ids.workspace = true
ferrum-policy.workspace = true
# Prometheus text rendering plus the read-only GET listener behind
# `--metrics-listen`. No dependencies of its own, and no second HTTP stack:
# this is std::net, like the webhook server beside it.
ferrum-metrics.workspace = true
# Same decision the agent's envelope parser makes, on the same signed slot: a
# wasm module this binary has no executor for must not load. Graph is
# ferrum-common; there is no wasm runtime in this tree to pull in.
ferrum-wasm-host.workspace = true
# Label watch only, and never with the k8smeta default features: the decision
# path must not grow a second client.
# Not `workspace = true`: that form cannot turn default features off here.
ferrum-k8smeta = { path = "../ferrum-k8smeta", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
apiserver = ["dep:ferrum-k8smeta", "ferrum-k8smeta/apiserver"]

[dev-dependencies]
ferrum-compiler.workspace = true
# Test bundles carry the slot the compiler emits, not an empty one.
ferrum-wasm-abi.workspace = true
serde_yaml.workspace = true
