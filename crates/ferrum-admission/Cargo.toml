[package]
name = "ferrum-admission"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Webhook. Forbidden: ferrum-compiler, aya, outbound net on hot path."

[dependencies]
chrono.workspace = true
ferrum-api.workspace = true
ferrum-common.workspace = true
ferrum-crypto.workspace = true
ferrum-ids.workspace = true
ferrum-policy.workspace = true
# Label watch only, and never with the k8smeta default features: the decision
# path must not grow a second client.
# Not `workspace = true`: that form cannot turn default features off here.
ferrum-k8smeta = { path = "../ferrum-k8smeta", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
apiserver = ["dep:ferrum-k8smeta", "ferrum-k8smeta/apiserver"]

[dev-dependencies]
ferrum-compiler.workspace = true
serde_yaml.workspace = true
