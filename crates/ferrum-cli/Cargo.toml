[package]
name = "ferrum-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "ferrum_cli"
path = "src/lib.rs"

[[bin]]
name = "ferrumctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ferrum-api.workspace = true
# The two break-glass operations an operator performs by hand: signing a grant
# in its own domain, and verifying somebody's journal chain.
ferrum-breakglass.workspace = true
ferrum-compiler.workspace = true
# The only crate that turns on x509: issuance stays off the admission/agent
# dependency graph.
ferrum-crypto = { workspace = true, features = ["x509"] }
ferrum-ids.workspace = true
ferrum-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
ferrum-testkit.workspace = true
