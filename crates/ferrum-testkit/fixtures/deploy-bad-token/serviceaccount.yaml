# The other half of the contradiction. Read on its own this line is defensible
# — an admission webhook that only answers AdmissionReview needs no token — and
# that is exactly why the defect survives review: the flag that makes it false
# is in a different file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferrum-admission
  namespace: ferrum
automountServiceAccountToken: false
