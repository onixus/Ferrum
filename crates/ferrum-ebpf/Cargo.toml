[package]
name = "ferrum-ebpf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Real kernel attach via aya. Opt-in: the default build must stay stable-1.75
# offline, and attach is not exercised by CI (needs CAP_BPF and a compiled
# bpf-target ELF from ferrum-ebpf-progs).
attach = ["dep:aya"]

[dependencies]
aya = { version = "=0.12.0", default-features = false, optional = true }
ferrum-common.workspace = true
ferrum-crypto.workspace = true
ferrum-ebpf-progs.workspace = true
ferrum-ids.workspace = true
ferrum-k8smeta.workspace = true

[dev-dependencies]
# tests/attach_live.rs makes the hooked syscalls by hand: a path longer than
# PATH_LEN and a pointer into a non-resident page cannot be produced through
# std::fs. Test-only; nothing in the crate graph gains libc.
libc.workspace = true
