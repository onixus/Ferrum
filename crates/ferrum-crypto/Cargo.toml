[package]
name = "ferrum-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-compact.workspace = true
ferrum-common.workspace = true
ferrum-ids.workspace = true
# X.509 issuance only. Admission and agent link this crate on the decision
# path and must not pull a certificate generator; see the workspace manifest.
rcgen = { workspace = true, optional = true }
sha2.workspace = true
x509-parser = { workspace = true, optional = true }

[features]
default = []
x509 = ["dep:rcgen", "dep:x509-parser"]
