apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policyexceptions.ferrum.io
spec:
  group: ferrum.io
  names:
    kind: PolicyException
    listKind: PolicyExceptionList
    plural: policyexceptions
    singular: policyexception
    shortNames:
      - polex
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ticket
          type: string
          jsonPath: .spec.ticket
        - name: RequestedBy
          type: string
          jsonPath: .spec.requestedBy
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Active
          type: boolean
          jsonPath: .status.active
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              # approvedBy is required unconditionally, not only under
              # fourEyes: fourEyes is self-declared by the requester and cannot
              # be the switch that decides whether a second approver is needed.
              # `ferrum-policy` refuses a waiver without one either way, so a
              # conditional CEL copy would admit objects the compiler refuses.
              required: [ticket, requestedBy, approvedBy, reason, expiresAt]
              x-kubernetes-validations:
                - rule: "self.expiresAt > now()"
                  message: "expiresAt already in the past"
                - rule: "self.expiresAt <= now() + duration('2160h')"
                  message: "expiresAt more than 90 days from now"
                # `has()` guards the evaluation, not the invariant: approvedBy
                # is required above, and an absent one is refused there. A CEL
                # rule that dereferences a missing key errors instead of
                # answering, which is a worse message for the same rejection.
                - rule: "!has(self.approvedBy) || self.approvedBy != self.requestedBy"
                  message: "self-approve is forbidden: approvedBy must differ from requestedBy"
                - rule: "has(self.target) && size(self.target.policies) > 0 && size(self.target.rules) > 0"
                  message: "target.policies and target.rules are required"
              properties:
                ticket:
                  type: string
                  minLength: 1
                requestedBy:
                  type: string
                  minLength: 1
                approvedBy:
                  type: string
                  minLength: 1
                reason:
                  # ferrum_policy::MIN_REASON_LEN. A shorter reason is a Slack
                  # status, not a justification, and the compiler says so.
                  type: string
                  minLength: 8
                expiresAt:
                  type: string
                  format: date-time
                mode:
                  type: string
                  enum: [observe, audit, enforce]
                fourEyes:
                  type: boolean
                target:
                  type: object
                  required: [policies, rules]
                  properties:
                    namespace:
                      type: string
                    policies:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    rules:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
            status:
              type: object
              properties:
                active:
                  type: boolean
                message:
                  type: string
