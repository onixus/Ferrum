apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtimeprofiles.ferrum.io
spec:
  group: ferrum.io
  names:
    kind: RuntimeProfile
    listKind: RuntimeProfileList
    plural: runtimeprofiles
    singular: runtimeprofile
    shortNames:
      - rprof
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      # No `subresources: status`, no status columns and no status schema, on
      # purpose. Nothing in this workspace writes RuntimeProfile's status: no
      # source file under `crates/ferrum-controller/src` builds a
      # `GroupVersionKind::gvk(…, "RuntimeProfile")`, so there is no
      # ApiResource, no watch and no PATCH, and the RBAC grant that would have
      # carried one was deleted for the same reason
      # (`deploy/controller/rbac.yaml`). `retain_policy_mode` and
      # `runtime_profile_status`, the two functions that once returned a status
      # for this kind, went with it.
      #
      # A declared status nobody fills is not an empty field. `ReadyForPromote
      # false` and `Drift 0` on a profile nothing observed read as a
      # measurement that was taken and came back clean. The `.spec` columns
      # below stay: they print what the operator wrote.
      #
      # Restore the subresource, the columns and the schema in the change that
      # adds the writer, not before
      # (`boundary_gate.rs::a_status_no_subject_writes_is_not_a_status_this_tree_ships`).
      additionalPrinterColumns:
        - name: SourcePolicy
          type: string
          jsonPath: .spec.sourcePolicy
        - name: Window
          type: string
          jsonPath: .spec.window
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [sourcePolicy]
              x-kubernetes-validations:
                - rule: "!has(self.window) || self.window.matches('^[0-9]+[hd]$')"
                  message: "window must look like 7d or 24h"
              properties:
                sourcePolicy:
                  type: string
                  minLength: 1
                window:
                  type: string
                  minLength: 2
