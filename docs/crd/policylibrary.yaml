apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policylibraries.ferrum.io
spec:
  group: ferrum.io
  names:
    kind: PolicyLibrary
    listKind: PolicyLibraryList
    plural: policylibraries
    singular: policylibrary
    shortNames:
      - plib
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Digest
          type: string
          jsonPath: .spec.digest
        - name: MinAgentAbi
          type: integer
          jsonPath: .spec.minAgentAbi
        - name: Verified
          type: boolean
          jsonPath: .status.verified
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, digest]
              x-kubernetes-validations:
                - rule: "self.digest.matches('^[0-9a-f]{64}$')"
                  message: "digest must be 64 lowercase hex characters (SHA-256)"
                - rule: "!has(self.minAgentAbi) || self.minAgentAbi >= 0"
                  message: "minAgentAbi must not be negative"
              properties:
                source:
                  type: string
                  minLength: 1
                digest:
                  type: string
                  minLength: 64
                  maxLength: 64
                minAgentAbi:
                  type: integer
                  format: int32
                  minimum: 0
                minAdmissionAbi:
                  type: integer
                  format: int32
                  minimum: 0
            status:
              type: object
              properties:
                ready:
                  type: boolean
                verified:
                  type: boolean
                message:
                  type: string
