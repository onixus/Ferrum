apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policylibraries.ferrum.io
spec:
  group: ferrum.io
  names:
    kind: PolicyLibrary
    listKind: PolicyLibraryList
    plural: policylibraries
    singular: policylibrary
    shortNames:
      - plib
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      # No `subresources: status`, no status column and no status schema, on
      # purpose. Nothing in this workspace writes PolicyLibrary's status: no
      # source file under `crates/ferrum-controller/src` builds a
      # `GroupVersionKind::gvk(…, "PolicyLibrary")`, so there is no
      # ApiResource, no watch and no PATCH, and the RBAC grant that would have
      # carried one was deleted for the same reason
      # (`deploy/controller/rbac.yaml`).
      #
      # A declared status nobody fills is not an empty field. The API server
      # defaults it, `kubectl get` prints the zero value of the column forever,
      # and `Verified false` on a library nobody checked reads as a verdict
      # rather than as silence. The `.spec` columns below stay: they print what
      # the operator wrote.
      #
      # Restore the subresource, the columns and the schema in the change that
      # adds the writer, not before
      # (`boundary_gate.rs::a_status_no_subject_writes_is_not_a_status_this_tree_ships`).
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Digest
          type: string
          jsonPath: .spec.digest
        - name: MinAgentAbi
          type: integer
          jsonPath: .spec.minAgentAbi
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, digest]
              x-kubernetes-validations:
                - rule: "self.digest.matches('^[0-9a-f]{64}$')"
                  message: "digest must be 64 lowercase hex characters (SHA-256)"
                - rule: "!has(self.minAgentAbi) || self.minAgentAbi >= 0"
                  message: "minAgentAbi must not be negative"
              properties:
                source:
                  type: string
                  minLength: 1
                digest:
                  type: string
                  minLength: 64
                  maxLength: 64
                minAgentAbi:
                  type: integer
                  format: int32
                  minimum: 0
                minAdmissionAbi:
                  type: integer
                  format: int32
                  minimum: 0
