apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersecuritypolicies.ferrum.io
spec:
  group: ferrum.io
  names:
    kind: ClusterSecurityPolicy
    listKind: ClusterSecurityPolicyList
    plural: clustersecuritypolicies
    singular: clustersecuritypolicy
    shortNames:
      - csp
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Ready
          type: boolean
          jsonPath: .status.compile.ready
        - name: Digest
          type: string
          jsonPath: .status.compile.bundleDigest
        - name: ClustersReady
          type: integer
          jsonPath: .status.rollout.clustersReady
        - name: ClustersDegraded
          type: integer
          jsonPath: .status.rollout.clustersDegraded
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!(has(self.disabled) && self.disabled && has(self.mode) && self.mode == 'enforce')"
                  message: "disabled=true together with mode=enforce"
                - rule: "!has(self.runtime) || !has(self.runtime.defaultAction) || !(self.runtime.defaultAction in ['kill', 'isolate'])"
                  message: "runtime.defaultAction kill/isolate is kill-all, not a policy"
                - rule: "!has(self.runtime) || !has(self.runtime.rules) || self.runtime.rules.all(r, !has(r.action) || !(r.action in ['kill', 'isolate']) || (has(r.syscalls) && size(r.syscalls) > 0) || (has(r.match) && ((has(r.match.commIn) && size(r.match.commIn) > 0) || (has(r.match.pathPrefix) && size(r.match.pathPrefix) > 0) || (has(r.match.pathSuffix) && size(r.match.pathSuffix) > 0))))"
                  message: "runtime rule with action kill/isolate needs syscalls or match, otherwise it is kill-all"
                - rule: "!has(self.supply) || !((has(self.supply.requireSigned) && self.supply.requireSigned) || (has(self.supply.denyUnsigned) && self.supply.denyUnsigned)) || (has(self.supply.trustRoots) && size(self.supply.trustRoots) > 0)"
                  message: "requireSigned/denyUnsigned without trustRoots: trust roots ride in the bundle"
              properties:
                mode:
                  type: string
                  enum: [observe, audit, enforce]
                priority:
                  type: integer
                  format: int32
                disabled:
                  type: boolean
                selector:
                  type: object
                  properties:
                    clusterSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    namespaceSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    workloadSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    serviceAccountSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required: [key, operator]
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    image:
                      type: object
                      properties:
                        registriesAllow:
                          type: array
                          items:
                            type: string
                        requireDigest:
                          type: boolean
                supply:
                  type: object
                  properties:
                    requireSigned:
                      type: boolean
                    denyUnsigned:
                      type: boolean
                    denyLatestTag:
                      type: boolean
                    trustRoots:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          keylessIssuerAllow:
                            type: array
                            items:
                              type: string
                          publicKeys:
                            type: array
                            items:
                              type: string
                admit:
                  type: object
                  properties:
                    failurePolicy:
                      type: string
                      enum: [Fail, Ignore]
                    pss:
                      type: string
                      enum: [privileged, baseline, restricted, custom]
                    deny:
                      type: object
                      properties:
                        privileged:
                          type: boolean
                        hostPID:
                          type: boolean
                        hostIPC:
                          type: boolean
                        hostNetwork:
                          type: boolean
                        hostPath:
                          type: boolean
                        allowPrivilegeEscalation:
                          type: boolean
                        runAsRoot:
                          type: boolean
                        wildcardsRbac:
                          type: boolean
                        clusterAdminBind:
                          type: boolean
                        addedCapabilities:
                          type: array
                          items:
                            type: string
                    mutate:
                      type: object
                      properties:
                        injectSeccompRuntimeDefault:
                          type: boolean
                        dropAllCapabilities:
                          type: boolean
                        readOnlyRootFilesystem:
                          type: boolean
                runtime:
                  type: object
                  properties:
                    defaultAction:
                      type: string
                      enum: [allow, audit, deny, kill, isolate]
                    rules:
                      type: array
                      items:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                          syscalls:
                            type: array
                            items:
                              type: string
                          match:
                            type: object
                            properties:
                              commIn:
                                type: array
                                items:
                                  type: string
                              containerOnly:
                                type: boolean
                              pathPrefix:
                                type: array
                                items:
                                  type: string
                              pathSuffix:
                                type: array
                                items:
                                  type: string
                              notAgentSelf:
                                type: boolean
                          action:
                            type: string
                            enum: [allow, audit, deny, kill, isolate]
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                compile:
                  type: object
                  properties:
                    ready:
                      type: boolean
                    bundleDigest:
                      type: string
                    compilerVersion:
                      type: string
                    message:
                      type: string
                rollout:
                  type: object
                  properties:
                    clustersReady:
                      type: integer
                      format: int32
                    clustersDegraded:
                      type: integer
                      format: int32
