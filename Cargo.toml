[workspace]
resolver = "2"
members = [
    "crates/ferrum-common",
    "crates/ferrum-ids",
    "crates/ferrum-api",
    "crates/ferrum-breakglass",
    "crates/ferrum-proto",
    "crates/ferrum-crypto",
    "crates/ferrum-policy",
    "crates/ferrum-compiler",
    "crates/ferrum-wasm-abi",
    "crates/ferrum-wasm-host",
    "crates/ferrum-ebpf",
    "crates/ferrum-ebpf-progs",
    "crates/ferrum-k8smeta",
    "crates/ferrum-admission",
    "crates/ferrum-agent",
    "crates/ferrum-controller",
    "crates/ferrum-export",
    "crates/ferrum-metrics",
    "crates/ferrum-siem",
    "crates/ferrum-cli",
    "crates/ferrum-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.97"

[workspace.dependencies]
ferrum-common = { path = "crates/ferrum-common" }
ferrum-ids = { path = "crates/ferrum-ids" }
ferrum-api = { path = "crates/ferrum-api" }
ferrum-breakglass = { path = "crates/ferrum-breakglass" }
ferrum-proto = { path = "crates/ferrum-proto" }
ferrum-crypto = { path = "crates/ferrum-crypto" }
ferrum-policy = { path = "crates/ferrum-policy" }
ferrum-compiler = { path = "crates/ferrum-compiler" }
ferrum-wasm-abi = { path = "crates/ferrum-wasm-abi" }
ferrum-wasm-host = { path = "crates/ferrum-wasm-host" }
ferrum-ebpf = { path = "crates/ferrum-ebpf" }
ferrum-ebpf-progs = { path = "crates/ferrum-ebpf-progs" }
ferrum-k8smeta = { path = "crates/ferrum-k8smeta" }
ferrum-export = { path = "crates/ferrum-export" }
ferrum-metrics = { path = "crates/ferrum-metrics" }
ferrum-siem = { path = "crates/ferrum-siem" }
ferrum-testkit = { path = "crates/ferrum-testkit" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
home = "0.5"
libc = "0.2"
# Offline PKI for the admission webhook serving cert (ferrum-crypto, feature
# "x509"; ferrum-cli is the only crate that turns it on). Without an issuer in
# this tree the deploy manifests carry a caBundle placeholder and cannot be
# applied at all. Per-crate builds of admission/agent must not link it; the
# Jenkins 'Crate boundary' stage checks the graphs a release build resolves.
# A --workspace build unifies features across members and does link it.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Same feature, other half: issuance without verification would be a fake Ok.
# `verify` is what actually checks the serving cert against the CA key.
x509-parser = { version = "0.17", features = ["verify"] }
indexmap = { version = "2", default-features = false, features = ["std"] }
k8s-openapi = { version = "0.25", default-features = false, features = ["v1_33"] }
kube = { version = "1", default-features = false, features = ["client", "runtime", "rustls-tls"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
# PEM + webpki only, ring backend, no openssl-sys (deny.toml).
#
# `rustls` itself is linked by exactly one member: `kube`'s TLS stack installs a
# process-wide CryptoProvider only under its `aws-lc-rs` feature, and building a
# `kube::Client` without one panics inside rustls before any request is made.
# The controller is the only crate that builds a client, so it is the only crate
# that carries this, and it selects the same backend the rest of the tree uses.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
