# NOT part of the base install. Applying this turns kill/isolate from a logged
# decision into an action the agent can take on its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferrum-agent-respond
  labels:
    app.kubernetes.io/part-of: ferrum
    ferrum.io/optional: "respond"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferrum-agent-respond
subjects:
  - kind: ServiceAccount
    name: ferrum-agent-respond
    namespace: ferrum
