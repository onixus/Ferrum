apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferrum-agent-respond
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-agent
    app.kubernetes.io/part-of: ferrum
    ferrum.io/agent-role: respond
# The identity exists in the base install; nothing is bound to it until
# optional-respond.yaml is applied.
