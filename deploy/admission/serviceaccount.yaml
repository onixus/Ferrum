apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferrum-admission
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-admission
    app.kubernetes.io/part-of: ferrum
# The webhook answers AdmissionReview over TLS and reads its bundle from a
# mounted Secret, but it does call the API server: deployment.yaml passes
# --apiserver, and the namespace/ServiceAccount label watch behind that flag
# authenticates with the projected token and nothing else. Turning this off
# leaves the label cache permanently cold, which denies every Pod a
# selector-bearing policy selects, and makes the list/watch grant in
# rbac.yaml unusable.
automountServiceAccountToken: true
