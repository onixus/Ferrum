apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ferrum-admission
  labels:
    app.kubernetes.io/part-of: ferrum
webhooks:
  - name: policy.ferrum.io
    admissionReviewVersions: ["v1"]
    matchPolicy: Equivalent
    # No mutation, no external calls: the decision is a pure function of the
    # signed bundle already on disk.
    sideEffects: None
    # Cluster security policy does not degrade to allow when the webhook is
    # unreachable. Pair this with >=2 replicas and the namespace exclusions
    # below, otherwise a cold cluster cannot start the webhook that gates it.
    failurePolicy: Fail
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["ferrum", "kube-system"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "*"
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings", "clusterrolebindings"]
        scope: "*"
    clientConfig:
      service:
        name: ferrum-admission
        namespace: ferrum
        path: /validate
        port: 443
      # Placeholder: replaced by the CA that issued ferrum-admission-tls.
      caBundle: REPLACE_WITH_PEM_CA_BUNDLE_BASE64
