apiVersion: v1
kind: Service
metadata:
  name: ferrum-admission
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-admission
    app.kubernetes.io/part-of: ferrum
spec:
  selector:
    app.kubernetes.io/name: ferrum-admission
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    # The scrape target. On this Service and not a second one because the
    # selector would be identical, and two Services over one set of Pods is two
    # places to forget. `targetPort: metrics` by name: the NetworkPolicy that
    # governs this port names it the same way, so a port number changed in the
    # Deployment moves both without touching either.
    - name: metrics
      port: 9102
      targetPort: metrics
      protocol: TCP
