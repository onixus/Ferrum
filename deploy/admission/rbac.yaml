apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferrum-admission
  labels:
    app.kubernetes.io/part-of: ferrum
# Read-only, and only the two kinds whose labels a policy selector needs.
# Everything else (bundle, exceptions) still arrives as a mounted Secret: an
# admission plugin that can read the cluster is a lateral-movement target.
rules:
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferrum-admission
  labels:
    app.kubernetes.io/part-of: ferrum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ferrum-admission
subjects:
  - kind: ServiceAccount
    name: ferrum-admission
    namespace: ferrum
