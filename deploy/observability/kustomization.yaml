# Everything about being watched from outside the process.
#
# Part of the default install and not an opt-in overlay, because the thing it
# installs is a *restriction*. An operator who applies `deploy` and forgets
# this directory would get the metrics ports — they are in the workload
# manifests — with nothing in front of them. The safe default is the one that
# arrives with the ports.
#
# The Grafana dashboard and the Prometheus alert rules beside this file are not
# Kubernetes objects and are not installed by anything: how a dashboard reaches
# Grafana, and how rules reach a Prometheus, are decisions about somebody
# else's stack (a provisioning sidecar, a ConfigMap they template, a UI import;
# a PrometheusRule, a file in `rule_files`), and shipping one of those as if it
# were the answer would be a guess in a directory whose whole job is not to
# guess. What this tree does guarantee about both is checked by
# `metrics_gate.rs`: every metric they name is one the binaries actually
# export, every rule points at a runbook section that exists, and the rules are
# evaluated for real by the `promtool test rules` suite beside them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - networkpolicy.yaml
