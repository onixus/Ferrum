apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-controller
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-controller
    app.kubernetes.io/part-of: ferrum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-controller
        app.kubernetes.io/part-of: ferrum
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
        prometheus.io/path: /metrics
        prometheus.io/scheme: http
    spec:
      serviceAccountName: ferrum-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # What makes the signing key readable at all. kubelet writes a Secret
        # volume root:root and moves the group only for an fsGroup, so without
        # this the key is owned by a user this container is not and mode 0440
        # leaves it nothing. See the volume below and `ferrumctl lint-deploy`
        # FD029.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/onixus/ferrum-controller:v0.1.0
          args:
            - run
            - --seed-file
            - /etc/ferrum/signing/seed
            - --namespace
            - ferrum
            # Where this controller publishes what it knows about itself:
            # counters per failure class, the run of each, and the reasons.
            # Deliberately not wired to any probe. Every degradation here is
            # either recoverable, in which case a restart is a crash loop, or
            # the deployment being wrong, in which case the process ends itself
            # once and says which class failed. See
            # `crates/ferrum-controller/src/health.rs`.
            - --status-dir
            - /run/ferrum
            # The same state, on a port, because the file is mode 0600 on this
            # Pod: without this an operator asking "is policy converging" has
            # to `kubectl exec` into the workload that holds the signing key.
            #
            # This used to say a port was refused here on principle — a second
            # attack surface, and an HTTP stack this crate's boundary does not
            # carry. Half of that stopped being true: `ferrum-metrics` is
            # `std::net`, no runtime, no TLS, and answers `GET /metrics` and
            # nothing else, with every request body unread. The other half is
            # still true and is paid rather than argued away: it is a surface,
            # so it is read-only, it publishes ids and never the free-text
            # causes (those stay in status.json), and
            # deploy/observability/networkpolicy.yaml stands in front of it.
            # Drop these two lines and the controller is exactly what it was.
            - --metrics-listen
            - 0.0.0.0:9104
          ports:
            - name: metrics
              containerPort: 9104
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: signing-key
              mountPath: /etc/ferrum/signing
              readOnly: true
            # The one writable path in this container. `readOnlyRootFilesystem`
            # above stays true: the status file gets a volume, not a writable
            # root.
            - name: status
              mountPath: /run/ferrum
      volumes:
        # The bundle signing key. Whoever reads this Secret can sign policy, so
        # it is mounted nowhere else in this tree.
        - name: signing-key
          secret:
            secretName: ferrum-signing-key
            # 0440 (r--r-----), written in decimal on purpose: `0400` is octal
            # 256 to the YAML 1.1 parser that applies this file and not an
            # integer at all to a 1.2 one, so the mode this Pod runs with
            # depended on which client applied it. 288 is the same number to
            # every reader. Group-readable and not world-readable, with the
            # fsGroup above putting the group on the running user: whoever
            # reads this Secret can sign policy.
            defaultMode: 288
        # Pod-lifetime, like the state it holds: these counters are about this
        # process, and a status file that outlived the process would report a
        # controller that is not running.
        - name: status
          emptyDir: {}
