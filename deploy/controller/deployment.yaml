apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrum-controller
  namespace: ferrum
  labels:
    app.kubernetes.io/name: ferrum-controller
    app.kubernetes.io/part-of: ferrum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferrum-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferrum-controller
        app.kubernetes.io/part-of: ferrum
    spec:
      serviceAccountName: ferrum-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/ferrum/ferrum-controller:v0.1.0
          args:
            - run
            - --seed-file
            - /etc/ferrum/signing/seed
            - --namespace
            - ferrum
            # Where this controller publishes what it knows about itself:
            # counters per failure class, the run of each, and the reasons.
            # Deliberately a file and not a port — a listening socket is a
            # second attack surface and an HTTP stack a dependency this crate's
            # boundary does not carry — and deliberately not wired to any
            # probe. Every degradation here is either recoverable, in which
            # case a restart is a crash loop, or the deployment being wrong, in
            # which case the process ends itself once and says which class
            # failed. See `crates/ferrum-controller/src/health.rs`.
            - --status-dir
            - /run/ferrum
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: signing-key
              mountPath: /etc/ferrum/signing
              readOnly: true
            # The one writable path in this container. `readOnlyRootFilesystem`
            # above stays true: the status file gets a volume, not a writable
            # root.
            - name: status
              mountPath: /run/ferrum
      volumes:
        # The bundle signing key. Whoever reads this Secret can sign policy, so
        # it is mounted nowhere else in this tree.
        - name: signing-key
          secret:
            secretName: ferrum-signing-key
            defaultMode: 0400
        # Pod-lifetime, like the state it holds: these counters are about this
        # process, and a status file that outlived the process would report a
        # controller that is not running.
        - name: status
          emptyDir: {}
